name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: python -m pip install -r project/requirements.txt
      - run: npm ci
      - run: python tools/build.py
      - run: npm run build
      - run: python -m pytest learning_app/tests tools/tests -q
      - run: npm run test:sandbox
      - run: npm run test:exercises

  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: course
          POSTGRES_PASSWORD: course
          POSTGRES_DB: course_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U course -d course_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Disposable service only: both runners reset this database's public schema.
      COURSE_DSN: postgresql://course:course@127.0.0.1:5432/course_test
      DATABASE_URL: postgresql://course:course@127.0.0.1:5432/course_test
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r project/requirements.txt
      - run: python tools/run_sql.py
      - run: python -m pytest tests -q
        working-directory: project
