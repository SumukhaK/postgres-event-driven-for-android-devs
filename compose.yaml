services:
  app:
    build: .
    environment:
      LEARNING_DB_PATH: /data/learning.sqlite3
      LEARNING_CREDENTIAL_KEY: ${LEARNING_CREDENTIAL_KEY:?Set LEARNING_CREDENTIAL_KEY in .env}
      LEARNING_COOKIE_SECURE: ${LEARNING_COOKIE_SECURE:-0}
    ports:
      - "${LEARNING_PORT:-8000}:8000"
    volumes:
      - learning-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  learning-data:
